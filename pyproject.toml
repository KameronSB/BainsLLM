[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bainsllm"
version = "0.1.0"
description = "A from-scratch experimental decoder-only transformer lab in PyTorch."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Kameron Bains" }
]

dependencies = [
  "numpy",
  "pandas",
  "tqdm",
  "pyyaml",
  "rich",
  "matplotlib"
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ipykernel",
  "ruff",
  "mypy"
]

rocm = [
  "torch==2.9.1+rocm6.4 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "pytorch-triton-rocm==3.5.1 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true